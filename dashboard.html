<script>
(() => {
const D = JSON.parse(document.getElementById('data').textContent);
const $ = s => document.querySelector(s);
const NS = 'http://www.w3.org/2000/svg';

// 문자열은 모두 textContent 로만 넣는다 (AI 코멘트는 신뢰할 수 없는 입력)
function el(tag, attrs = {}, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (v == null || v === false) continue;
    if (k === 'class') e.className = v; else if (k === 'style') e.style.cssText = v; else e.setAttribute(k, v);
  }
  for (const k of kids.flat()) if (k != null && k !== false) e.append(k instanceof Node ? k : document.createTextNode(String(k)));
  return e;
}
function sv(tag, attrs = {}, text) {
  const e = document.createElementNS(NS, tag);
  for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v);
  if (text != null) e.textContent = text;
  return e;
}

const MINUS = '−';
const color = id => `var(--s-${id}, var(--muted))`;
const sign = v => v > 0 ? '+' : v < 0 ? MINUS : '';
const pct = (v, d = 2) => v == null ? '–' : sign(v) + Math.abs(v * 100).toFixed(d) + '%';
const pp = v => v == null ? '–' : sign(v) + Math.abs(v * 100).toFixed(2) + '%p';
const num = v => v == null ? '–' : Math.round(v).toLocaleString('ko-KR');
const won = v => num(v) + '원';
const snum = v => sign(Math.round(v)) + num(Math.abs(v));
const share = v => (v * 100).toFixed(v > 0 && v < 0.1 ? 1 : 0) + '%';
const dir = v => v == null || Math.abs(v) < 5e-5 ? 'flat' : v > 0 ? 'up' : 'down';
const arrow = v => ({ up: '▲', down: '▼', flat: '' })[dir(v)];
const fmtDate = d => `${d.slice(0, 4)}-${d.slice(4, 6)}-${d.slice(6)}`;
const shortDate = d => `${+d.slice(4, 6)}/${+d.slice(6)}`;
const label = p => p.baseline ? 'KODEX 200' : p.name;
const byConfig = [...D.participants].sort((a, b) => D.order.indexOf(a.id) - D.order.indexOf(b.id));
const R = D.rules;

// ---------- 머리말 ----------
document.title = D.title;
$('h1').textContent = D.title;
if (D.nav.length > 1) for (const n of D.nav)
  $('#nav').append(el('a', { href: encodeURIComponent(n.file), 'aria-current': n.file === D.self ? 'page' : null }, n.title));
$('#sub').textContent = `매 거래일 17:30 종가로 주문 수량을 정하고 다음 거래일 시가에 체결 · 시작 자금 각 ${num(R.capital / 10000)}만원`;
$('#asof').textContent = D.dates.length ? `기준일 ${fmtDate(D.day)} · ${D.dates.length}거래일째` : '아직 기록 없음 — 첫 실행은 평일 17:30';
$('#generated').textContent = `갱신 ${D.generated} · 다음 갱신 평일 17:30`;
if (D.failed.length) $('#notice').append(el('p', { class: 'notice' }, `시세 수집 실패 ${D.failed.length}종목 (오늘 계산에서 제외)`));

// ---------- 순위 카드 ----------
for (const p of D.participants) {
  $('#tiles').append(el('div', { class: 'card tile' },
    el('div', { class: 'top' },
      el('span', { class: 'rank' }, `${p.rank}위`),
      el('span', { class: 'key', style: `background:${color(p.id)}` }),
      el('span', { class: 'pname' }, label(p))),
    el('div', { class: `value ${dir(p.ret)}` }, pct(p.ret)),
    el('div', { class: 'eq' }, won(p.equity)),
    el('div', { class: 'deltas' },
      el('span', {}, '오늘 ', p.today == null ? '첫날' : el('b', { class: dir(p.today) }, arrow(p.today) + pct(Math.abs(p.today)).replace('+', ''))),
      p.baseline ? el('span', {}, '기준선') : el('span', {}, 'KODEX 대비 ', el('b', { class: dir(p.excess) }, pp(p.excess))))));
}

// ---------- 누적 수익률 그래프 ----------
for (const p of byConfig) $('#legend').append(el('span', {}, el('i', { class: 'lk', style: `background:${color(p.id)}` }), label(p)));

function niceStep(raw) {
  const pow = 10 ** Math.floor(Math.log10(raw));
  return [1, 2, 2.5, 5, 10].map(m => m * pow).find(s => s >= raw);
}
function tickText(v, step) {
  let d = 0;
  while (d < 3 && Math.abs(Math.round(step * 100 * 10 ** d) - step * 100 * 10 ** d) > 1e-6) d++;
  return (Math.abs(v) < step / 2 ? '0' : sign(v) + Math.abs(v * 100).toFixed(d)) + '%';
}
const lastIdx = c => c.reduce((a, v, i) => v == null ? a : i, -1);

function drawChart() {
  const host = $('#chart');
  host.replaceChildren();
  const n = D.dates.length;
  if (!n) { host.append(el('p', { class: 'muted' }, '아직 기록이 없습니다')); return; }
  const W = Math.max(280, host.clientWidth), narrow = W < 600, H = narrow ? 240 : 300;
  const m = { l: 52, r: narrow ? 14 : 150, t: 12, b: 30 };
  const pw = W - m.l - m.r, ph = H - m.t - m.b;
  const vals = D.participants.flatMap(p => p.curve.filter(v => v != null));
  let lo = Math.min(0, ...vals), hi = Math.max(0, ...vals);
  if (hi - lo < 0.01) { const mid = (hi + lo) / 2; lo = Math.min(0, mid - 0.005); hi = Math.max(0, mid + 0.005); }
  const step = niceStep((hi - lo) / 4);
  lo = Math.floor(lo / step - 1e-9) * step; hi = Math.ceil(hi / step + 1e-9) * step;
  const x = i => n === 1 ? m.l + pw : m.l + pw * i / (n - 1);
  const y = v => m.t + ph * (hi - v) / (hi - lo);

  const svg = sv('svg', { width: W, height: H, viewBox: `0 0 ${W} ${H}`, role: 'img', tabindex: 0,
    'aria-label': '참가자별 누적 수익률 추이. 좌우 화살표로 날짜를 옮길 수 있습니다' });
  const ticks = Math.round((hi - lo) / step);
  for (let k = 0; k <= ticks; k++) {
    const v = lo + k * step, yy = Math.round(y(v)) + 0.5, zero = Math.abs(v) < step / 2;
    svg.append(sv('line', { x1: m.l, x2: W - m.r, y1: yy, y2: yy, stroke: zero ? 'var(--axis)' : 'var(--grid)', 'stroke-width': 1 }));
    svg.append(sv('text', { x: m.l - 10, y: yy, 'text-anchor': 'end', 'dominant-baseline': 'middle', class: 'tick' }, tickText(v, step)));
  }
  const every = Math.max(1, Math.ceil(n / Math.max(2, Math.floor(pw / 64))));
  for (let i = n - 1; i >= 0; i -= every)
    svg.append(sv('text', { x: x(i), y: H - 8, 'text-anchor': n === 1 ? 'end' : 'middle', class: 'tick' }, shortDate(D.dates[i])));

  const drawOrder = [...byConfig].sort((a, b) => b.baseline - a.baseline);  // 기준선을 맨 아래에
  for (const p of drawOrder) {
    const pts = p.curve.map((v, i) => v == null ? null : [x(i), y(v)]);
    const d = pts.reduce((acc, pt, i) => pt ? acc + (acc && pts[i - 1] ? 'L' : 'M') + pt[0].toFixed(1) + ',' + pt[1].toFixed(1) : acc, '');
    svg.append(sv('path', { d, fill: 'none', stroke: color(p.id), 'stroke-width': 2, 'stroke-linejoin': 'round', 'stroke-linecap': 'round' }));
  }
  for (const p of drawOrder) {
    const i = lastIdx(p.curve);
    if (i >= 0) svg.append(sv('circle', { cx: x(i), cy: y(p.curve[i]), r: 4, fill: color(p.id), stroke: 'var(--card)', 'stroke-width': 2 }));
  }

  // 끝점 라벨: 겹치면 아래로 밀고 지시선으로 잇는다
  if (!narrow) {
    const labs = drawOrder.map(p => { const i = lastIdx(p.curve); return { p, i, y0: y(p.curve[i]), y: y(p.curve[i]) }; })
      .filter(l => l.i >= 0).sort((a, b) => a.y - b.y);
    for (let k = 1; k < labs.length; k++) labs[k].y = Math.max(labs[k].y, labs[k - 1].y + 17);
    const over = labs.length ? labs[labs.length - 1].y - (H - m.b) : 0;
    if (over > 0) labs.forEach(l => l.y -= over);
    const lx = W - m.r + 18;
    for (const l of labs) {
      svg.append(sv('path', { d: `M${x(l.i) + 6},${l.y0} L${lx - 5},${l.y}`, stroke: 'var(--axis)', fill: 'none', 'stroke-width': 1 }));
      const t = sv('text', { x: lx, y: l.y, 'dominant-baseline': 'middle', class: 'endlab' });
      t.append(sv('tspan', { class: 'endval' }, pct(l.p.curve[l.i])), sv('tspan', { class: 'endname', dx: 6 }, label(l.p)));
      svg.append(t);
    }
  }

  // 마우스 오버: 세로선이 가장 가까운 날짜에 붙고, 툴팁에 모든 참가자 값을 보여 준다
  const cross = sv('line', { y1: m.t, y2: H - m.b, stroke: 'var(--axis)', 'stroke-width': 1, visibility: 'hidden' });
  svg.append(cross, sv('rect', { x: m.l - 12, y: 0, width: pw + 24, height: H, fill: 'transparent' }));
  const tip = el('div', { class: 'tip', role: 'status' });
  tip.hidden = true;
  host.append(svg, tip);
  let cur = -1;
  const show = i => {
    cur = i;
    const xx = x(i);
    cross.setAttribute('x1', xx); cross.setAttribute('x2', xx); cross.setAttribute('visibility', 'visible');
    const rows = D.participants.filter(p => p.curve[i] != null).sort((a, b) => b.curve[i] - a.curve[i])
      .map(p => el('div', { class: 'tip-row' }, el('i', { class: 'lk', style: `background:${color(p.id)}` }), el('b', {}, pct(p.curve[i])), el('span', {}, label(p))));
    tip.replaceChildren(el('div', { class: 'tip-date' }, fmtDate(D.dates[i])), ...rows);
    tip.hidden = false;
    const tw = tip.offsetWidth;
    let left = xx + 14;
    if (left + tw > W) left = xx - 14 - tw;
    tip.style.left = Math.max(0, left) + 'px';
    tip.style.top = m.t + 'px';
  };
  const hide = () => { cross.setAttribute('visibility', 'hidden'); tip.hidden = true; };
  const idxAt = px => n === 1 ? 0 : Math.max(0, Math.min(n - 1, Math.round((px - m.l) / pw * (n - 1))));
  svg.addEventListener('pointermove', e => show(idxAt(e.clientX - svg.getBoundingClientRect().left)));
  svg.addEventListener('pointerleave', hide);
  svg.addEventListener('focus', () => show(cur < 0 ? n - 1 : cur));
  svg.addEventListener('blur', hide);
  svg.addEventListener('keydown', e => {
    if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') {
      show(Math.max(0, Math.min(n - 1, cur + (e.key === 'ArrowLeft' ? -1 : 1))));
      e.preventDefault();
    }
  });
}

// 그래프의 표 보기: 날짜별 누적 수익률 (괄호 안은 그날 수익률)
(() => {
  const head = el('tr', {}, el('th', {}, '날짜'), byConfig.map(p => el('th', { class: 'r' }, label(p))));
  const body = D.dates.map((d, i) => i).reverse().map(i => el('tr', {}, el('td', {}, fmtDate(D.dates[i])),
    byConfig.map(p => {
      const v = p.curve[i], prev = i > 0 ? p.curve[i - 1] : null;
      const day = v != null && prev != null ? (1 + v) / (1 + prev) - 1 : null;
      return el('td', { class: 'r' }, el('span', { class: dir(v) }, pct(v)), day == null ? '' : el('span', { class: 'muted' }, ` (${pct(day)})`));
    })));
  $('#daily').append(el('table', {}, el('thead', {}, head), el('tbody', {}, body)));
})();

// ---------- 참가자 카드 ----------
const ftip = $('#ftip');
function hoverTip(node, lines) {
  const place = (cx, cy) => {
    ftip.replaceChildren(el('div', { class: 'tip-row' }, el('b', {}, lines[1])), el('div', { class: 'tip-date' }, lines[0]));
    ftip.hidden = false;
    const w = ftip.offsetWidth, h = ftip.offsetHeight;
    ftip.style.left = Math.min(cx + 12, innerWidth - w - 8) + 'px';
    ftip.style.top = Math.max(8, cy - h - 12) + 'px';
  };
  node.addEventListener('pointermove', e => place(e.clientX, e.clientY));
  node.addEventListener('pointerleave', () => ftip.hidden = true);
  node.addEventListener('focus', () => { const r = node.getBoundingClientRect(); place(r.left + r.width / 2, r.top); });
  node.addEventListener('blur', () => ftip.hidden = true);
}

function segBar(p) {
  const parts = p.holdings.map(h => ({ name: h.name, w: h.weight, v: h.value, fill: color(p.id), ink: '#ffffff' }));
  const cashW = p.cash / p.equity;
  if (cashW > 0.0005) parts.push({ name: '현금', w: cashW, v: p.cash, fill: 'var(--cash)', ink: 'var(--cash-ink)' });
  const bar = el('div', { class: 'seg', role: 'img', 'aria-label': '비중: ' + parts.map(x => `${x.name} ${share(x.w)}`).join(', ') });
  for (const x of parts) {
    const s = el('div', { class: 'segp', tabindex: 0, style: `flex:${x.w} 1 0;background:${x.fill};color:${x.ink}`,
      'aria-label': `${x.name} ${share(x.w)} ${won(x.v)}`, 'data-full': `${x.name} ${share(x.w)}`, 'data-short': share(x.w) },
      el('span', {}, `${x.name} ${share(x.w)}`));
    hoverTip(s, [x.name, `${(x.w * 100).toFixed(1)}% · ${won(x.v)}`]);
    bar.append(s);
  }
  return bar;
}
// 칸에 들어가지 않는 글자는 자르지 않고 숨긴다 (값은 표와 툴팁에 있음)
function fitSegLabels() {
  for (const s of document.querySelectorAll('.segp')) {
    const span = s.firstChild;
    span.classList.remove('hide');
    span.textContent = s.dataset.full;
    if (span.offsetWidth + 14 > s.clientWidth) span.textContent = s.dataset.short;
    if (span.offsetWidth + 14 > s.clientWidth) span.classList.add('hide');
  }
}

function holdingsTable(p) {
  const head = el('tr', {}, el('th', {}, '종목'), el('th', { class: 'r' }, '수량'), el('th', { class: 'r opt' }, '평균 매입가'),
    el('th', { class: 'r opt' }, '종가'), el('th', { class: 'r' }, '평가액'), el('th', { class: 'r' }, '비중'), el('th', { class: 'r' }, '손익'));
  const rows = p.holdings.map(h => el('tr', {},
    el('td', {}, h.name, p.baseline ? null : el('span', { class: 'code' }, h.code)),
    el('td', { class: 'r' }, num(h.qty) + '주'), el('td', { class: 'r opt' }, num(h.avg)), el('td', { class: 'r opt' }, num(h.close)),
    el('td', { class: 'r' }, num(h.value)), el('td', { class: 'r' }, share(h.weight)),
    el('td', { class: 'r' }, el('span', { class: dir(h.pnl) }, pct(h.pnl)))));
  rows.push(el('tr', { class: 'cashrow' }, el('td', {}, '현금'), el('td', {}), el('td', { class: 'opt' }), el('td', { class: 'opt' }),
    el('td', { class: 'r' }, num(p.cash)), el('td', { class: 'r' }, share(p.cash / p.equity)), el('td', {})));
  if (p.realized != null) rows.push(el('tr', { class: 'cashrow' }, el('td', {}, '실현손익 (매도 누적)'), el('td', {}),
    el('td', { class: 'opt' }), el('td', { class: 'opt' }),
    el('td', { class: 'r' }, el('span', { class: dir(p.realized / p.equity) }, snum(p.realized))), el('td', {}), el('td', {})));
  return el('div', {}, el('h4', {}, '지금 보유'), el('div', { class: 'tblwrap' }, el('table', {}, el('thead', {}, head), el('tbody', {}, rows))));
}

function planBlock(p) {
  const box = el('div', { class: 'plan' }, el('h4', {}, '내일 시가 주문'));
  const pl = p.plan;
  if (!pl) return box.append(el('p', { class: 'muted' }, '오늘 결정 기록이 없습니다')), box;
  if (pl.status !== 'ok') {
    box.append(el('p', { class: 'abstain' }, '기권 — ', (pl.notes || []).join('; ') || '응답 오류'),
      el('p', { class: 'plan-foot' }, '보유를 그대로 유지합니다'));
    return box;
  }
  if (pl.comment) box.append(el('blockquote', { style: `border-color:${color(p.id)}` }, pl.comment));
  if (pl.summary) box.append(el('p', { class: 'summary' }, pl.summary));
  const traded = pl.rows.filter(r => r.side);
  const rows = pl.rows.flatMap(r => [el('tr', { class: r.reason ? 'has-reason' : null },
    el('td', {}, r.name),
    el('td', { class: 'r' }, el('span', { class: 'muted' }, share(r.cur)), el('span', { class: 'arrow' }, '→'), share(r.tgt)),
    el('td', { class: 'r' }, r.side ? el('b', { class: r.side === 'buy' ? 'up' : 'down' }, `${num(r.qty)}주 ${r.side === 'buy' ? '매수' : '매도'}`)
      : el('span', { class: 'muted' }, Math.abs(r.tgt - r.cur) >= R.band ? '1주 가격 초과' : '유지'))),
    r.reason ? el('tr', { class: 'reason' }, el('td', { colspan: 3 }, r.reason)) : null].filter(Boolean));
  if (rows.length) box.append(el('div', { class: 'tblwrap' }, el('table', {},
    el('thead', {}, el('tr', {}, el('th', {}, '종목'), el('th', { class: 'r' }, '비중 지금 → 목표'), el('th', { class: 'r' }, '주문'))),
    el('tbody', {}, rows))));
  if (!traded.length) box.append(el('p', { class: 'plan-foot' }, '주문 없음 — 보유를 그대로 유지합니다'));
  const links = (pl.sources || []).map(x => { try { const u = new URL(x.url); return /^https?:$/.test(u.protocol) ? [x, u] : null; } catch { return null; } }).filter(Boolean);
  if (!links.length && !p.baseline) box.append(el('p', { class: 'plan-foot' }, '웹 검색 출처 없음'));
  if (links.length) box.append(el('h4', { style: 'margin-top:14px' }, `참고한 자료 ${links.length}건`),
    el('ul', { class: 'sources' }, links.map(([x, u]) => el('li', {},
      el('a', { href: u.href, target: '_blank', rel: 'noopener noreferrer' }, x.title), el('span', { class: 'host' }, u.hostname)))));
  const foot = p.baseline ? ['기준선: 처음에 산 뒤 계속 보유']
    : [pl.model, pl.secs != null ? `응답 ${pl.secs}초` : null, pl.attempts > 1 ? `${pl.attempts}회 시도` : null].filter(Boolean);
  box.append(el('p', { class: 'plan-foot' }, foot.join(' · ')));
  return box;
}

$('#plan-note').textContent = `비중 차이 ${share(R.band)} 미만은 거래하지 않음`;
for (const p of D.participants) {
  $('#people').append(el('article', { class: 'card' },
    el('div', { class: 'phead' },
      el('div', { class: 'pid' }, el('span', { class: 'key', style: `background:${color(p.id)}` }), el('h3', {}, p.name),
        el('span', { class: 'model' }, p.baseline ? '기준선' : p.model)),
      el('div', { class: 'pstat' }, `${p.rank}위 · `, el('b', {}, won(p.equity)), ' ', el('span', { class: dir(p.ret) }, pct(p.ret)))),
    segBar(p),
    el('div', { class: 'pgrid' }, holdingsTable(p), planBlock(p))));
}

// ---------- 최근 체결 ----------
(() => {
  if (!D.fills.length) return $('#fills').append(el('p', { class: 'muted' }, '아직 체결이 없습니다'));
  const head = el('tr', {}, ['날짜', '참가자', '종목', '구분'].map(t => el('th', {}, t)),
    ['수량', '체결가', '비용', '실현손익'].map(t => el('th', { class: 'r' }, t)));
  let prev = null;
  const rows = D.fills.map(f => {
    const first = f.date !== prev;
    prev = f.date;
    return el('tr', { class: first && D.fills[0] !== f ? 'group' : null },
      el('td', {}, first ? fmtDate(f.date) : ''),
      el('td', {}, el('span', { style: 'display:inline-flex;align-items:center;gap:6px' },
        el('span', { class: 'key', style: `background:${color(f.pid)}` }), f.pname)),
      el('td', {}, f.name), el('td', {}, el('span', { class: f.side === 'buy' ? 'up' : 'down' }, f.side === 'buy' ? '매수' : '매도')),
      el('td', { class: 'r' }, num(f.qty) + '주'), el('td', { class: 'r' }, num(f.price)), el('td', { class: 'r' }, num(f.cost)),
      el('td', { class: 'r' }, f.realized == null ? '' :
        el('span', { class: dir(f.realized_pct) }, `${snum(f.realized)} (${pct(f.realized_pct, 1)})`)));
  });
  $('#fills').append(el('table', {}, el('thead', {}, head), el('tbody', {}, rows)));
})();

// ---------- 규칙 ----------
$('#rules').append(
  el('p', {}, `체결 규칙 — 결정일 종가로 주식 수를 정하고 다음 거래일 시가에 체결 (매도 먼저, 매수는 현금 한도 안에서) · 수수료 ${(R.commission * 100).toFixed(3)}% · 매도세 ${(R.sell_tax * 100).toFixed(2)}% · 슬리피지 ${(R.slippage * 100).toFixed(1)}% · 종목당 최대 ${share(R.max_weight)}`),
  el('p', {}, 'AI 가 과거 주가를 이미 학습했기 때문에 과거 데이터로 미리 돌려 볼 수 없어 오늘부터 앞으로만 기록합니다. 짧은 기간의 순위는 대부분 운이니 KODEX 200 기준선과 함께 보세요.'));

drawChart();
fitSegLabels();
let t;
addEventListener('resize', () => { clearTimeout(t); t = setTimeout(() => { drawChart(); fitSegLabels(); }, 120); });
})();
</script>
</body>
