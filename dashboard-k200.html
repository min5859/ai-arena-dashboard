<html lang="ko">

<title>AI 모의투자 대회</title>
<style>
:root {
  color-scheme: light;
  --page: #f9f9f7; --card: #ffffff;
  --ink: #0b0b0b; --ink-2: #52514e; --muted: #898781;
  --grid: #e1e0d9; --axis: #c3c2b7; --ring: rgba(11,11,11,0.10); --wash: rgba(11,11,11,0.035);
  --up: #c8312f; --down: #1c5cab;
  --s-gemini: #2a78d6; --s-claude: #eb6834; --s-gpt: #1baf7a; --s-baseline: #898781; --s-consensus: #8a5cd6; --s-live: #b5367f;
  --cash: #e8e7e1; --cash-ink: #52514e;
  --shadow: 0 6px 24px rgba(11,11,11,0.10);
}
@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --page: #0d0d0d; --card: #1a1a19;
    --ink: #f0efec; --ink-2: #c3c2b7; --muted: #898781;
    --grid: #2c2c2a; --axis: #4a4a46; --ring: rgba(255,255,255,0.10); --wash: rgba(255,255,255,0.05);
    --up: #ee6b6b; --down: #5f9fec;
    --s-gemini: #3987e5; --s-claude: #d95926; --s-gpt: #199e70; --s-baseline: #898781; --s-consensus: #9d74e8; --s-live: #d0559a;
    --cash: #383835; --cash-ink: #c3c2b7;
    --shadow: 0 6px 24px rgba(0,0,0,0.5);
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--page); color: var(--ink);
  font: 15px/1.55 system-ui, -apple-system, "Apple SD Gothic Neo", "Segoe UI", sans-serif; -webkit-font-smoothing: antialiased; }
main { max-width: 1120px; margin: 0 auto; padding: 32px 16px 56px; }
header { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 6px 24px; margin-bottom: 20px; }
h1 { font-size: 24px; font-weight: 650; letter-spacing: -0.01em; margin: 0; }
h2 { font-size: 16px; font-weight: 650; margin: 0; }
h3 { font-size: 17px; font-weight: 650; margin: 0; }
h4 { font-size: 13px; font-weight: 600; color: var(--ink-2); margin: 0 0 8px; }
p { margin: 0; }
.sub { color: var(--ink-2); font-size: 14px; margin-top: 4px; }
.meta { color: var(--muted); font-size: 13px; text-align: right; }
.nav { display: flex; gap: 6px; margin-bottom: 14px; }
.nav a { font-size: 13px; color: var(--ink-2); text-decoration: none; padding: 4px 12px; border-radius: 999px; border: 1px solid var(--ring); }
.nav a:hover { background: var(--wash); color: var(--ink); }
.nav a[aria-current="page"] { background: var(--ink); color: var(--card); border-color: var(--ink); }
.muted { color: var(--muted); }
.up { color: var(--up); } .down { color: var(--down); } .flat { color: var(--ink-2); }
.card { background: var(--card); border: 1px solid var(--ring); border-radius: 14px; padding: 20px; }
section { margin-top: 16px; }
.section-title { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 6px 16px; margin: 28px 2px 10px; }
.notice { margin-top: 12px; padding: 10px 14px; border-radius: 10px; background: var(--wash); color: var(--ink-2); font-size: 14px; }
.notice::before { content: "⚠ "; }

/* 순위 카드 */
.tiles { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
@media (max-width: 880px) { .tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.tile { padding: 16px 18px; }
.tile .top { display: flex; align-items: center; gap: 8px; font-size: 14px; color: var(--ink-2); min-width: 0; }
.tile .top .pname { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rank { font-size: 12px; font-weight: 650; color: var(--muted); white-space: nowrap; flex: none; }
.key { width: 10px; height: 10px; border-radius: 50%; flex: none; }
.tile .value { font-size: 28px; font-weight: 650; letter-spacing: -0.01em; margin-top: 6px; line-height: 1.2; }
.tile .eq { color: var(--ink-2); font-size: 14px; margin-top: 2px; }
.tile .deltas { display: flex; flex-wrap: wrap; gap: 2px 12px; font-size: 13px; color: var(--muted); margin-top: 8px; }
.tile .deltas b { font-weight: 600; }

/* 그래프 */
.card-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 8px 20px; margin-bottom: 12px; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 13px; color: var(--ink-2); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.lk { display: inline-block; width: 14px; height: 3px; border-radius: 2px; flex: none; }
.chart { position: relative; }
.chart svg { display: block; overflow: visible; }
.chart svg:focus { outline: none; }
.chart svg:focus-visible { outline: 2px solid var(--axis); outline-offset: 4px; border-radius: 4px; }
.tick { fill: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
.endlab { font-size: 12.5px; }
.endval { fill: var(--ink); font-weight: 600; font-variant-numeric: tabular-nums; }
.endname { fill: var(--ink-2); }
.tip { position: absolute; pointer-events: none; background: var(--card); border: 1px solid var(--ring); box-shadow: var(--shadow);
  border-radius: 10px; padding: 8px 12px; font-size: 13px; min-width: 150px; z-index: 2; }
.tip-date { color: var(--muted); font-size: 12px; margin-bottom: 4px; }
.tip-row { display: flex; align-items: center; gap: 8px; line-height: 1.7; }
.tip-row b { font-weight: 650; font-variant-numeric: tabular-nums; min-width: 58px; }
.tip-row span:last-child { color: var(--ink-2); }
details { margin-top: 14px; }
summary { cursor: pointer; color: var(--ink-2); font-size: 13px; }
summary:hover { color: var(--ink); }

/* 표 */
.tblwrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
th { color: var(--muted); font-weight: 500; text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--grid); white-space: nowrap; }
td { padding: 7px 8px; border-bottom: 1px solid var(--grid); white-space: nowrap; }
tr:last-child td { border-bottom: 0; }
.r { text-align: right; font-variant-numeric: tabular-nums; }
.code { color: var(--muted); font-size: 12px; margin-left: 6px; }
.cashrow td { color: var(--ink-2); }
.group td { border-top: 1px solid var(--axis); }
@media (max-width: 560px) { .opt, .code { display: none; } }

/* 참가자 카드 */
.people { display: grid; grid-template-columns: minmax(0, 1fr); gap: 12px; }
.phead { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 4px 16px; }
.pid { display: flex; align-items: center; gap: 8px; min-width: 0; }
.pid .key { align-self: center; }
.model { color: var(--muted); font-size: 13px; }
.pstat { font-size: 14px; color: var(--ink-2); }
.pstat b { color: var(--ink); font-weight: 650; }
.seg { display: flex; gap: 2px; height: 28px; margin: 14px 0 18px; }
.segp { min-width: 2px; border-radius: 4px; display: flex; align-items: center; padding: 0 8px; overflow: visible;
  font-size: 12px; font-weight: 600; white-space: nowrap; cursor: default; }
.segp:hover, .segp:focus-visible { filter: brightness(1.08); outline: none; }
.segp span.hide { visibility: hidden; }
.pgrid { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr); gap: 28px; }
@media (max-width: 860px) { .pgrid { grid-template-columns: minmax(0, 1fr); gap: 20px; } }
blockquote { margin: 0 0 12px; padding: 2px 0 2px 12px; border-left: 3px solid; color: var(--ink); font-size: 14px; line-height: 1.6; white-space: normal; }
.plan td { white-space: nowrap; }
.plan .arrow { color: var(--muted); margin: 0 4px; }
.plan-foot { color: var(--muted); font-size: 12.5px; margin-top: 10px; }
.summary { color: var(--ink-2); font-size: 14px; line-height: 1.65; margin: 0 0 12px; }
.plan tr.has-reason td { border-bottom: 0; padding-bottom: 2px; }
.plan tr.reason td { white-space: normal; color: var(--ink-2); font-size: 12.5px; line-height: 1.55; padding-top: 0; }
.sources { margin: 12px 0 0; padding: 0; list-style: none; font-size: 12.5px; }
.sources li { margin: 3px 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sources a { color: var(--ink-2); text-decoration: underline; text-decoration-color: var(--axis); text-underline-offset: 2px; }
.sources a:hover { color: var(--ink); }
.sources .host { color: var(--muted); margin-left: 6px; }
.abstain { color: var(--ink); font-size: 14px; }

footer { margin-top: 32px; color: var(--muted); font-size: 13px; line-height: 1.7; }
#ftip { position: fixed; pointer-events: none; }
</style>

  const y = v => m.t + ph * (hi - v) / (hi - lo);

  const svg = sv('svg', { width: W, height: H, viewBox: `0 0 ${W} ${H}`, role: 'img', tabindex: 0,
    'aria-label': '참가자별 누적 수익률 추이. 좌우 화살표로 날짜를 옮길 수 있습니다' });
  const ticks = Math.round((hi - lo) / step);
  for (let k = 0; k <= ticks; k++) {
    const v = lo + k * step, yy = Math.round(y(v)) + 0.5, zero = Math.abs(v) < step / 2;
    svg.append(sv('line', { x1: m.l, x2: W - m.r, y1: yy, y2: yy, stroke: zero ? 'var(--axis)' : 'var(--grid)', 'stroke-width': 1 }));
    svg.append(sv('text', { x: m.l - 10, y: yy, 'text-anchor': 'end', 'dominant-baseline': 'middle', class: 'tick' }, tickText(v, step)));
  }
  const every = Math.max(1, Math.ceil(n / Math.max(2, Math.floor(pw / 64))));
  for (let i = n - 1; i >= 0; i -= every)
    svg.append(sv('text', { x: x(i), y: H - 8, 'text-anchor': n === 1 ? 'end' : 'middle', class: 'tick' }, shortDate(D.dates[i])));

  const drawOrder = [...byConfig].sort((a, b) => b.baseline - a.baseline);  // 기준선을 맨 아래에
  for (const p of drawOrder) {
    const pts = p.curve.map((v, i) => v == null ? null : [x(i), y(v)]);
    const d = pts.reduce((acc, pt, i) => pt ? acc + (acc && pts[i - 1] ? 'L' : 'M') + pt[0].toFixed(1) + ',' + pt[1].toFixed(1) : acc, '');
    svg.append(sv('path', { d, fill: 'none', stroke: color(p.id), 'stroke-width': 2, 'stroke-linejoin': 'round', 'stroke-linecap': 'round' }));
  }
  for (const p of drawOrder) {
    const i = lastIdx(p.curve);
    if (i >= 0) svg.append(sv('circle', { cx: x(i), cy: y(p.curve[i]), r: 4, fill: color(p.id), stroke: 'var(--card)', 'stroke-width': 2 }));
  }

  // 끝점 라벨: 겹치면 아래로 밀고 지시선으로 잇는다
  if (!narrow) {
    const labs = drawOrder.map(p => { const i = lastIdx(p.curve); return { p, i, y0: y(p.curve[i]), y: y(p.curve[i]) }; })
      .filter(l => l.i >= 0).sort((a, b) => a.y - b.y);
    for (let k = 1; k < labs.length; k++) labs[k].y = Math.max(labs[k].y, labs[k - 1].y + 17);
    const over = labs.length ? labs[labs.length - 1].y - (H - m.b) : 0;
    if (over > 0) labs.forEach(l => l.y -= over);
    const lx = W - m.r + 18;
    for (const l of labs) {
      svg.append(sv('path', { d: `M${x(l.i) + 6},${l.y0} L${lx - 5},${l.y}`, stroke: 'var(--axis)', fill: 'none', 'stroke-width': 1 }));
      const t = sv('text', { x: lx, y: l.y, 'dominant-baseline': 'middle', class: 'endlab' });
      t.append(sv('tspan', { class: 'endval' }, pct(l.p.curve[l.i])), sv('tspan', { class: 'endname', dx: 6 }, label(l.p)));
      svg.append(t);
    }
  }

  // 마우스 오버: 세로선이 가장 가까운 날짜에 붙고, 툴팁에 모든 참가자 값을 보여 준다
  const cross = sv('line', { y1: m.t, y2: H - m.b, stroke: 'var(--axis)', 'stroke-width': 1, visibility: 'hidden' });
  svg.append(cross, sv('rect', { x: m.l - 12, y: 0, width: pw + 24, height: H, fill: 'transparent' }));
  const tip = el('div', { class: 'tip', role: 'status' });
  tip.hidden = true;
  host.append(svg, tip);
  let cur = -1;
  const show = i => {
    cur = i;
    const xx = x(i);
    cross.setAttribute('x1', xx); cross.setAttribute('x2', xx); cross.setAttribute('visibility', 'visible');
    const rows = D.participants.filter(p => p.curve[i] != null).sort((a, b) => b.curve[i] - a.curve[i])
      .map(p => el('div', { class: 'tip-row' }, el('i', { class: 'lk', style: `background:${color(p.id)}` }), el('b', {}, pct(p.curve[i])), el('span', {}, label(p))));
    tip.replaceChildren(el('div', { class: 'tip-date' }, fmtDate(D.dates[i])), ...rows);
    tip.hidden = false;
    const tw = tip.offsetWidth;
    let left = xx + 14;
    if (left + tw > W) left = xx - 14 - tw;
    tip.style.left = Math.max(0, left) + 'px';
    tip.style.top = m.t + 'px';
  };
  const hide = () => { cross.setAttribute('visibility', 'hidden'); tip.hidden = true; };
  const idxAt = px => n === 1 ? 0 : Math.max(0, Math.min(n - 1, Math.round((px - m.l) / pw * (n - 1))));
  svg.addEventListener('pointermove', e => show(idxAt(e.clientX - svg.getBoundingClientRect().left)));
  svg.addEventListener('pointerleave', hide);
  svg.addEventListener('focus', () => show(cur < 0 ? n - 1 : cur));
  svg.addEventListener('blur', hide);
  svg.addEventListener('keydown', e => {
    if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') {
      show(Math.max(0, Math.min(n - 1, cur + (e.key === 'ArrowLeft' ? -1 : 1))));
      e.preventDefault();
    }
  });
}

// 그래프의 표 보기: 날짜별 누적 수익률 (괄호 안은 그날 수익률)
(() => {
  const head = el('tr', {}, el('th', {}, '날짜'), byConfig.map(p => el('th', { class: 'r' }, label(p))));
  const body = D.dates.map((d, i) => i).reverse().map(i => el('tr', {}, el('td', {}, fmtDate(D.dates[i])),
    byConfig.map(p => {
      const v = p.curve[i], prev = i > 0 ? p.curve[i - 1] : null;
      const day = v != null && prev != null ? (1 + v) / (1 + prev) - 1 : null;
      return el('td', { class: 'r' }, el('span', { class: dir(v) }, pct(v)), day == null ? '' : el('span', { class: 'muted' }, ` (${pct(day)})`));
    })));
  $('#daily').append(el('table', {}, el('thead', {}, head), el('tbody', {}, body)));
})();

// ---------- 참가자 카드 ----------
const ftip = $('#ftip');
function hoverTip(node, lines) {
  const place = (cx, cy) => {
    ftip.replaceChildren(el('div', { class: 'tip-row' }, el('b', {}, lines[1])), el('div', { class: 'tip-date' }, lines[0]));
    ftip.hidden = false;
    const w = ftip.offsetWidth, h = ftip.offsetHeight;
    ftip.style.left = Math.min(cx + 12, innerWidth - w - 8) + 'px';
    ftip.style.top = Math.max(8, cy - h - 12) + 'px';
  };
  node.addEventListener('pointermove', e => place(e.clientX, e.clientY));
  node.addEventListener('pointerleave', () => ftip.hidden = true);
  node.addEventListener('focus', () => { const r = node.getBoundingClientRect(); place(r.left + r.width / 2, r.top); });
  node.addEventListener('blur', () => ftip.hidden = true);
}

function segBar(p) {
  const parts = p.holdings.map(h => ({ name: h.name, w: h.weight, v: h.value, fill: color(p.id), ink: '#ffffff' }));
  const cashW = p.cash / p.equity;
  if (cashW > 0.0005) parts.push({ name: '현금', w: cashW, v: p.cash, fill: 'var(--cash)', ink: 'var(--cash-ink)' });
  const bar = el('div', { class: 'seg', role: 'img', 'aria-label': '비중: ' + parts.map(x => `${x.name} ${share(x.w)}`).join(', ') });
  for (const x of parts) {
    const s = el('div', { class: 'segp', tabindex: 0, style: `flex:${x.w} 1 0;background:${x.fill};color:${x.ink}`,
      'aria-label': `${x.name} ${share(x.w)} ${won(x.v)}`, 'data-full': `${x.name} ${share(x.w)}`, 'data-short': share(x.w) },
      el('span', {}, `${x.name} ${share(x.w)}`));
    hoverTip(s, [x.name, `${(x.w * 100).toFixed(1)}% · ${won(x.v)}`]);
    bar.append(s);
  }
  return bar;
}
// 칸에 들어가지 않는 글자는 자르지 않고 숨긴다 (값은 표와 툴팁에 있음)
function fitSegLabels() {
  for (const s of document.querySelectorAll('.segp')) {
    const span = s.firstChild;
    span.classList.remove('hide');
    span.textContent = s.dataset.full;
    if (span.offsetWidth + 14 > s.clientWidth) span.textContent = s.dataset.short;
    if (span.offsetWidth + 14 > s.clientWidth) span.classList.add('hide');
  }
}

function holdingsTable(p) {
  const head = el('tr', {}, el('th', {}, '종목'), el('th', { class: 'r' }, '수량'), el('th', { class: 'r opt' }, '평균 매입가'),
    el('th', { class: 'r opt' }, '종가'), el('th', { class: 'r' }, '평가액'), el('th', { class: 'r' }, '비중'), el('th', { class: 'r' }, '손익'));
  const rows = p.holdings.map(h => el('tr', {},
    el('td', {}, h.name, p.baseline ? null : el('span', { class: 'code' }, h.code)),
    el('td', { class: 'r' }, num(h.qty) + '주'), el('td', { class: 'r opt' }, num(h.avg)), el('td', { class: 'r opt' }, num(h.close)),
    el('td', { class: 'r' }, num(h.value)), el('td', { class: 'r' }, share(h.weight)),
    el('td', { class: 'r' }, el('span', { class: dir(h.pnl) }, pct(h.pnl)))));
  rows.push(el('tr', { class: 'cashrow' }, el('td', {}, '현금'), el('td', {}), el('td', { class: 'opt' }), el('td', { class: 'opt' }),
    el('td', { class: 'r' }, num(p.cash)), el('td', { class: 'r' }, share(p.cash / p.equity)), el('td', {})));
  if (p.realized != null) rows.push(el('tr', { class: 'cashrow' }, el('td', {}, '실현손익 (매도 누적)'), el('td', {}),
    el('td', { class: 'opt' }), el('td', { class: 'opt' }),
    el('td', { class: 'r' }, el('span', { class: dir(p.realized / p.equity) }, snum(p.realized))), el('td', {}), el('td', {})));
  return el('div', {}, el('h4', {}, '지금 보유'), el('div', { class: 'tblwrap' }, el('table', {}, el('thead', {}, head), el('tbody', {}, rows))));
}

function planBlock(p) {
  const box = el('div', { class: 'plan' }, el('h4', {}, '내일 시가 주문'));
  const pl = p.plan;
  if (p.live) return box.append(el('p', { class: 'muted' }, '합의 결정을 다음 거래일 08:40 장전 동시호가에 따라 삽니다 (수량은 운용 금액 기준)')), box;
  if (!pl) return box.append(el('p', { class: 'muted' }, '오늘 결정 기록이 없습니다')), box;
  if (pl.status !== 'ok') {
    box.append(el('p', { class: 'abstain' }, '기권 — ', (pl.notes || []).join('; ') || '응답 오류'),
      el('p', { class: 'plan-foot' }, '보유를 그대로 유지합니다'));
    return box;
  }
  if (pl.comment) box.append(el('blockquote', { style: `border-color:${color(p.id)}` }, pl.comment));
  if (pl.summary) box.append(el('p', { class: 'summary' }, pl.summary));
  const traded = pl.rows.filter(r => r.side);
  const rows = pl.rows.flatMap(r => [el('tr', { class: r.reason ? 'has-reason' : null },
    el('td', {}, r.name),
    el('td', { class: 'r' }, el('span', { class: 'muted' }, share(r.cur)), el('span', { class: 'arrow' }, '→'), share(r.tgt)),
    el('td', { class: 'r' }, r.side ? el('b', { class: r.side === 'buy' ? 'up' : 'down' }, `${num(r.qty)}주 ${r.side === 'buy' ? '매수' : '매도'}`)
      : el('span', { class: 'muted' }, Math.abs(r.tgt - r.cur) >= R.band ? '1주 가격 초과' : '유지'))),
    r.reason ? el('tr', { class: 'reason' }, el('td', { colspan: 3 },
      Array.isArray(r.reason) ? r.reason.map(x => el('div', {}, x)) : r.reason)) : null].filter(Boolean));
  if (rows.length) box.append(el('div', { class: 'tblwrap' }, el('table', {},
    el('thead', {}, el('tr', {}, el('th', {}, '종목'), el('th', { class: 'r' }, '비중 지금 → 목표'), el('th', { class: 'r' }, '주문'))),
    el('tbody', {}, rows))));
  if (!traded.length) box.append(el('p', { class: 'plan-foot' }, '주문 없음 — 보유를 그대로 유지합니다'));
  const links = (pl.sources || []).map(x => { try { const u = new URL(x.url); return /^https?:$/.test(u.protocol) ? [x, u] : null; } catch { return null; } }).filter(Boolean);
  if (!links.length && !p.virtual) box.append(el('p', { class: 'plan-foot' }, '웹 검색 출처 없음'));
  if (links.length) box.append(el('h4', { style: 'margin-top:14px' }, `참고한 자료 ${links.length}건`),
    el('ul', { class: 'sources' }, links.map(([x, u]) => el('li', {},
      el('a', { href: u.href, target: '_blank', rel: 'noopener noreferrer' }, x.title), el('span', { class: 'host' }, u.hostname)))));
  const foot = p.baseline ? ['기준선: 처음에 산 뒤 계속 보유']
    : [pl.model, pl.secs != null ? `응답 ${pl.secs}초` : null, pl.attempts > 1 ? `${pl.attempts}회 시도` : null].filter(Boolean);
  box.append(el('p', { class: 'plan-foot' }, foot.join(' · ')));
  return box;
}

$('#plan-note').textContent = `비중 차이 ${share(R.band)} 미만은 거래하지 않음`;
for (const p of D.participants) {
  $('#people').append(el('article', { class: 'card' },
    el('div', { class: 'phead' },
      el('div', { class: 'pid' }, el('span', { class: 'key', style: `background:${color(p.id)}` }), el('h3', {}, p.name),
        el('span', { class: 'model' }, p.baseline ? '기준선' : p.model)),

    segBar(p),
    el('div', { class: 'pgrid' }, holdingsTable(p), planBlock(p))));
}

// ---------- 후보 비교 ----------
(() => {
  const rows = D.compare.rows;
  if (!rows.length) return $('#compare').append(el('p', { class: 'muted' }, '아직 기록이 없습니다'));
  const cols = [['수익', ''], ['KODEX 대비', ''], ['최대 낙폭', ''], ['변동성', 'opt'], ['샤프', 'opt'], ['현금 효과', 'opt'],
    ['종목 선택', ''], ['최대 업종', ''], ['업종 차이', 'opt'], ['회전율', 'opt'], ['비용', 'opt']];
  const head = el('tr', {}, el('th', {}, '후보'), el('th', { class: 'opt' }, '시작'),
    cols.map(([t, c]) => el('th', { class: `r ${c}` }, t)), el('th', {}, '합격 기준'));
  const signed = (v, f) => el('span', { class: dir(v) }, f(v));
  const plain = (v, f) => v == null ? '–' : f(v);
  const mixText = m => Object.entries(m).sort((a, b) => b[1] - a[1])
    .map(([s, w]) => `${s} ${share(w)} (KODEX ${share(D.compare.index_mix[s] || 0)})`).join('\n');
  let prev = null;
  const body = rows.flatMap(r => {
    const out = [];
    if (r.group === '대안' && prev !== '대안') out.push(el('tr', { class: 'group' },
      el('td', { colspan: cols.length + 3, class: 'muted' }, '합의 대안 — 같은 AI 결정을 다른 방식으로 묶어 대회 첫날부터 다시 계산한 가상 성적')));
    prev = r.group;
    const c = r.criteria;
    out.push(el('tr', {},
      el('td', {}, el('span', { style: 'display:inline-flex;align-items:center;gap:6px' },
        el('span', { class: 'key', style: `background:${color(r.id)}` }), r.name)),
      el('td', { class: 'opt muted' }, `${shortDate(r.start)} · ${r.days}일`),
      el('td', { class: 'r' }, signed(r.ret, pct)), el('td', { class: 'r' }, signed(r.excess, pp)),
      el('td', { class: 'r' }, plain(r.mdd, v => pct(v, 1))),
      el('td', { class: 'r opt' }, plain(r.vol, v => (v * 100).toFixed(0) + '%')),
      el('td', { class: 'r opt' }, plain(r.sharpe, v => v.toFixed(1))),
      el('td', { class: 'r opt' }, signed(r.cash_eff, pp)), el('td', { class: 'r' }, signed(r.selection, pp)),
      el('td', { class: 'r', title: mixText(r.mix) }, r.sector == null ? '–' : `${r.sector} ${share(r.sector_w)}`),
      el('td', { class: 'r opt' }, plain(r.sector_gap, share)),
      el('td', { class: 'r opt' }, plain(r.turnover, v => v.toFixed(1) + '배')),
      el('td', { class: 'r opt' }, plain(r.cost, v => (v * 100).toFixed(2) + '%')),
      el('td', {}, c == null ? el('span', { class: 'muted' }, '기준선') : c.status === '통과' ? el('b', {}, c.text)
        : c.status === '진행 중' ? el('span', { class: 'muted' }, `${c.days}/60일`) : c.text)));
    return out;
  });
  $('#compare').append(el('table', {}, el('thead', {}, head), el('tbody', {}, body)));
  $('#compare-foot').append('변동성·샤프는 1년으로 환산한 값이라 60거래일 전에는 참고용 · 현금 효과 + 종목 선택 ≈ KODEX 대비 · ',
    '업종은 KRX 업종(주식 안 비중, 칸에 마우스를 올리면 전체), KODEX 업종 비중은 코스피 200 시가총액 근사 · ',
    '비용 = 수수료·세금·슬리피지 ÷ 시작 자금 · 후보가 많을수록 우연히 좋아 보이는 것이 섞입니다');
})();

// ---------- 최근 체결 ----------
(() => {
  if (!D.fills.length) return $('#fills').append(el('p', { class: 'muted' }, '아직 체결이 없습니다'));
  const head = el('tr', {}, ['날짜', '참가자', '종목', '구분'].map(t => el('th', {}, t)),
    ['수량', '체결가', '비용', '실현손익'].map(t => el('th', { class: 'r' }, t)));

      el('td', {}, f.name), el('td', {}, el('span', { class: f.side === 'buy' ? 'up' : 'down' }, f.side === 'buy' ? '매수' : '매도')),
      el('td', { class: 'r' }, num(f.qty) + '주'), el('td', { class: 'r' }, num(f.price)), el('td', { class: 'r' }, num(f.cost)),

  el('p', {}, `체결 규칙 — 결정일 종가로 주식 수를 정하고 다음 거래일 시가에 체결 (매도 먼저, 매수는 현금 한도 안에서) · 수수료 ${(R.commission * 100).toFixed(3)}% · 매도세 ${(R.sell_tax * 100).toFixed(2)}% · 슬리피지 ${(R.slippage * 100).toFixed(1)}% · 종목당 최대 ${share(R.max_weight)}`),
  el('p', {}, 'AI 가 과거 주가를 이미 학습했기 때문에 과거 데이터로 미리 돌려 볼 수 없어 오늘부터 앞으로만 기록합니다. 짧은 기간의 순위는 대부분 운이니 KODEX 200 기준선과 함께 보세요.'));

drawChart();
fitSegLabels();
let t;
addEventListener('resize', () => { clearTimeout(t); t = setTimeout(() => { drawChart(); fitSegLabels(); }, 120); });
})();
